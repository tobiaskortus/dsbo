name: Tests

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "native-v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          test -n "$PRIVATE_REPO_TOKEN" || { echo "PRIVATE_REPO_TOKEN is not configured"; exit 1; }
          git config --global url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu --no-cache-dir
          python -m pip install --no-cache-dir -e ".[dev]"
          git config --global --unset-all url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf

      - name: Run unit tests
        run: python -m pytest tests

  test-native:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package native sources
        run: |
          cmake -DVERSION=0.0.0-ci -DSOURCE_REVISION="$GITHUB_SHA" -DOUTPUT_DIR=dist/native -P cpp/cmake/PackageSource.cmake

      - name: Verify checksum and extract package
        working-directory: dist/native
        run: |
          sha256sum --check dsbo-native-0.0.0-ci.tar.gz.sha256
          tar -xzf dsbo-native-0.0.0-ci.tar.gz -C "$RUNNER_TEMP"

      - name: Build and run native tests without network access
        run: |
          sudo unshare --net -- sh -ec '
            cmake -S "$1/cpp" -B "$2" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
            cmake --build "$2" --target check --parallel 2
          ' sh "$RUNNER_TEMP/dsbo-native-0.0.0-ci" "$RUNNER_TEMP/native-package-build"
