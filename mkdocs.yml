site_name: dsbo - Distributed Surrogate-Based Optimization
site_description: Distributed, differentiable workflows for particle detector design optimization
site_author: Tobias Kortus
repo_url: https://github.com/tobiaskortus/dsbo
repo_name: tobiaskortus/dsbo
edit_uri: edit/main/docs/
copyright: "&copy; 2026 Tobias Kortus"

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
validation:
  links:
    anchors: warn
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Introduction: index.md
  - Guide:
      - Getting Started:
          - Parameter Spaces and Candidates: guide/parameters.md
          - Writing Modules: guide/modules.md
          - File Storage and Working Directories: guide/io.md
          - Native C++ HDF5 I/O: guide/native_io.md
          - Building Workflows: guide/workflows.md
          - Differentiable Workflows: guide/autograd.md
          - Parallelization with Dask: guide/parallelization.md
          - Writing Surrogates: guide/surrogates.md
      - Putting It Together:
          - Gradient-Based Optimization: guide/gradient-based-optimization.md
          - Surrogate-Assisted Optimization: guide/surrogate-assisted-optimization.md
      - Advanced Topics:
          - Module Templates and Dynamic Submodules: guide/module-templates-and-dynamic-submodules.md
          - Containerized Modules: guide/containers.md
          - Reverse and Forward Gradient Flow: guide/gradient-flow.md
          - Stochastic Execution and Reproducibility: guide/reproducibility.md
          - Batch-Fused Workflow Stages: guide/batch-fusion.md
          - Logging Metrics: guide/metrics.md
          - Artifacts: guide/artifacts.md
  - Examples:
      - HepEmShow Calorimeter: examples/hepemshow.md
  - Contributing: contributing.md
