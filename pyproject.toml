[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=3.0,<4", "cmake>=3.26", "ninja>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Surrogate-Based Optimization"
requires-python = ">=3.11"
license-files = ["LICENSES/*"]

dependencies = [
    "cryptography==50.0.2",
    "dask[distributed]==2026.3.0",
    "dask-jobqueue==0.9.0",
    "dsbo_heterogeneous @ git+https://github.com/tobiaskortus/dsbo_heterogeneous.git@main",
    "diffusers==0.38.0",
    "filelock==4.2.8",
    "graphviz==0.21",
    "ipython==8.39.0",
    "lightning==2.6.6",
    "matplotlib==3.10.9",
    "networkx==3.4.2",
    "numpy==2.2.6",
    "psutil==7.2.2",
    "pytorch-lightning==2.6.6",
    "sqlalchemy==2.0.51",
    "sqlmodel==0.0.39",
    "sqlite-vec==0.1.9",
    "torch==2.15.0",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "grpcio-tools==1.81.1",
    "mkdocs==1.6.1",
    "pre-commit==4.6.2",
    "pymdown-extensions==12.2",
    "pytest==9.0.3",
    "h5py>=3.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
