[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Suroogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "dask[distributed]",
    "dask-jobqueue",
    "grpcio",
    "grpcio-tools",
    "graphviz",
    "dask_heterogeneous @ git+https://github.com/tobiaskortus/dask_heterogeneous.git@main"
]

[project.optional-dependencies]
optuna = [
    "optuna",
    "optuna-integration[botorch]"
]

[project.optional-dependencies]
aido = [
    "diffusers"
]

all = [
    "optuna",
    "optuna-integration[botorch]"
    "diffusers"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
