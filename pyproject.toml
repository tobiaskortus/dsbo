[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Surrogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "cryptography==45.0.7",
    "dask[distributed]==2026.3.0",
    "dask-jobqueue==0.9.0",
    "dsbo_heterogeneous @ git+https://github.com/tobiaskortus/dsbo_heterogeneous.git@main",
    "diffusers==0.38.0",
    "filelock==3.29.3",
    "graphviz==0.21",
    "h5py==3.16.0",
    "ipython==9.14.1",
    "lightning==2.6.5",
    "matplotlib==3.10.9",
    "networkx==3.6.1",
    "numpy==2.4.6",
    "psutil==7.2.2",
    "pytorch-lightning==2.6.5",
    "sqlalchemy==2.0.51",
    "sqlmodel==0.0.39",
    "sqlite-vec==0.1.9",
    "torch==2.12.0",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.81.1",
    "mkdocs==1.6.1",
    "pre-commit==4.6.2",
    "pymdown-extensions==12.2",
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
