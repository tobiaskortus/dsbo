[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Suroogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "dask[distributed]",
    "grpcio",
    "grpcio-tools",
]

[project.optional-dependencies]
optuna = ["optuna"]
all = ["optuna"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
