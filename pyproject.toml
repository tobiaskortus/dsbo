[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=3.0,<4", "cmake>=3.26", "ninja>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Surrogate-Based Optimization"
requires-python = ">=3.10"
license-files = ["LICENSES/*"]

dependencies = [
    "attrs",
    "dask[distributed]",
    "dask-jobqueue",
    "dask_heterogeneous @ git+https://github.com/tobiaskortus/dask_heterogeneous.git@main",
    "diffusers",
    "duckdb",
    "duckdb-engine",
    "filelock",
    "graphviz",
    "grpcio",
    "lancedb",
    "lightning",
    "matplotlib",
    "networkx",
    "numpy",
    "optuna",
    "optuna-integration[botorch]",
    "pandas",
    "psutil",
    "pyarrow",
    "pytorch-lightning",
    "sqlalchemy",
    "sqlmodel",
    "sqlite-vec",
    "ipython",
    "diffusers",
    "torch",
    "tqdm",
    "uproot>=5,<6",
]

[project.optional-dependencies]
dev = [
    "build",
    "grpcio-tools",
    "pre-commit",
    "pytest",
    "h5py>=3.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
