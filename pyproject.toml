[build-system]
requires = ["setuptools>=61.0", "pybind11>=3.0,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Surrogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "attrs",
    "dask[distributed]",
    "dask-jobqueue",
    "dask_heterogeneous @ git+https://github.com/tobiaskortus/dask_heterogeneous.git@main",
    "diffusers",
    "duckdb",
    "duckdb-engine",
    "filelock",
    "graphviz",
    "grpcio",
    "lancedb",
    "lightning",
    "matplotlib",
    "networkx",
    "numpy",
    "optuna",
    "optuna-integration[botorch]",
    "pandas",
    "psutil",
    "pyarrow",
    "pytorch-lightning",
    "sqlalchemy",
    "sqlmodel",
    "sqlite-vec",
    "ipython",
    "diffusers",
    "torch",
    "tqdm",
    "uproot>=5,<6",
]

[project.optional-dependencies]
dev = [
    "build",
    "grpcio-tools",
    "pre-commit",
    "pytest",
    "h5py>=3.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]

[tool.setuptools.package-data]
"dsbo.utils.io.storage" = ["include/dsbo/*.hpp", "include/dsbo/third_party/*.hpp", "licenses/*.txt", "licenses/*.md"]
