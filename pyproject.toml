[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Surrogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "dask[distributed]",
    "dask-jobqueue",
    "dsbo_heterogeneous @ git+https://github.com/tobiaskortus/dsbo_heterogeneous.git@main",
    "diffusers",
    "filelock",
    "graphviz",
    "h5py",
    "ipython",
    "lightning",
    "matplotlib",
    "networkx",
    "numpy",
    "psutil",
    "pytorch-lightning",
    "sqlalchemy",
    "sqlmodel",
    "sqlite-vec",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools",
    "pre-commit",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]
