[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsbo"
version = "0.1.0"
description = "Detector Suroogate-Based Optimization"
requires-python = ">=3.10"

dependencies = [
    "tqdm",
    "attrs",
    "torch",
    "numpy",
    "typer",
    "pandas",
    "cookiecutter",
    "dask[distributed]",
    "dask-jobqueue",
    "grpcio",
    "grpcio-tools",
    "graphviz",
    "matplotlib",
    "lancedb",
    "duckdb",
    "duckdb-engine",
    "sqlmodel",
    "sqlite-vec",
    "dask_heterogeneous @ git+https://github.com/tobiaskortus/dask_heterogeneous.git@main"
]

[project.optional-dependencies]
optuna = [
    "optuna",
    "optuna-integration[botorch]",
]

aido = [
    "diffusers",
]

all = [
    "optuna",
    "optuna-integration[botorch]",
    "diffusers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dsbo*"]


[project.entry-points."console_scripts"]
dsbo-create = "dsbo.cli.main:app"
